services:
  # ---------------------------------------------------------------------------
  # EduPath Backend API (Express + TypeScript + Google Gemini Flash + Supabase)
  # ---------------------------------------------------------------------------
  - type: web
    name: edupath-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: resumes

  # ---------------------------------------------------------------------------
  # EduPath Frontend (React + Vite + Tailwind CSS + Lucide Icons)
  # ---------------------------------------------------------------------------
  - type: staticSite
    name: edupath-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        fromService:
          type: web
          name: edupath-server
          property: host
