<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/edupath-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduPath — Your Personal AI Career Coach</title>
    <meta name="description" content="AI agent that reads your resume, identifies skill gaps for target roles, and generates personalized adaptive sprints." />
  </head>
  <body class="bg-[#0B0F1A] text-slate-100 antialiased selection:bg-brand-500/20 selection:text-brand-300 min-h-screen relative">
    <!-- Progressive enhancement SVG Refraction Filter for Chromium Liquid Glass -->
    <svg aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden;" version="1.1" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="liquid-glass" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
          <feTurbulence type="fractalNoise" baseFrequency="0.04 0.04" numOctaves="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="60" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
